name: portal-fornecedores

services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-fornecedores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
      POSTGRES_DB: portal_fornecedores
    ports:
      - "5432:5432"
    volumes:
      - portal-fornecedores-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_fornecedores"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: portal-fornecedores-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: portal_minio
      MINIO_ROOT_PASSWORD: portal_minio_password
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    volumes:
      - portal-fornecedores-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: portal-fornecedores-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 portal_minio portal_minio_password &&
      mc mb -p local/portal-fornecedores-documentos || true &&
      mc anonymous set none local/portal-fornecedores-documentos &&
      exit 0
      "

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: portal-fornecedores-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portal-fornecedores-postgres-data:
    name: portal-fornecedores-postgres-data
  portal-fornecedores-minio-data:
    name: portal-fornecedores-minio-data
